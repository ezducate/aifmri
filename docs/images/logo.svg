<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AIFmri — functional imaging for neural networks">
  <defs>
    <!-- The brain silhouette, reused for clip and outline -->
    <path id="brain" d="M256 80
      C218 80 186 96 170 124
      C134 130 106 158 102 194
      C100 212 104 228 113 242
      C93 257 80 281 80 308
      C80 352 116 388 162 388
      L170 388
      C180 410 202 424 228 424
      C239 424 249 421 256 416
      C263 421 273 424 284 424
      C310 424 332 410 342 388
      L350 388
      C396 388 432 352 432 308
      C432 281 419 257 399 242
      C408 228 412 212 410 194
      C406 158 378 130 342 124
      C326 96 294 80 256 80 Z"/>
    <clipPath id="brainClip"><use href="#brain"/></clipPath>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#FF7A18" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark app-UI tile -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#141824"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="103" fill="none" stroke="#2a3145" stroke-width="3"/>

  <!-- Warm halo behind the brain -->
  <circle cx="256" cy="200" r="185" fill="url(#halo)"/>

  <!-- Icon: a brain whose layers light up on the inferno colormap -->
  <g transform="translate(256 196) scale(0.62) translate(-256 -252)">
    <g clip-path="url(#brainClip)">
      <!-- resting-state background -->
      <rect x="60" y="60" width="392" height="380" fill="#0c0e18"/>
      <!-- network layers, activation rising left to right (inferno) -->
      <rect x="88"  y="60" width="38" height="380" fill="#1b0c41"/>
      <rect x="131" y="60" width="38" height="380" fill="#450a69"/>
      <rect x="174" y="60" width="38" height="380" fill="#6a176e"/>
      <rect x="217" y="60" width="38" height="380" fill="#932667"/>
      <rect x="260" y="60" width="38" height="380" fill="#bc3754"/>
      <rect x="303" y="60" width="38" height="380" fill="#dd513a"/>
      <rect x="346" y="60" width="38" height="380" fill="#f37819"/>
      <rect x="389" y="60" width="38" height="380" fill="#fbb61a"/>

      <!-- wiring between active channels -->
      <g stroke="#ffb163" stroke-width="3.5" stroke-linecap="round" opacity="0.55">
        <line x1="145" y1="227" x2="231" y2="207"/>
        <line x1="231" y1="207" x2="274" y2="157"/>
        <line x1="231" y1="207" x2="274" y2="267"/>
        <line x1="274" y1="157" x2="317" y2="197"/>
        <line x1="274" y1="267" x2="317" y2="197"/>
        <line x1="317" y1="197" x2="360" y2="147"/>
        <line x1="317" y1="197" x2="360" y2="237"/>
        <line x1="360" y1="147" x2="402" y2="187"/>
        <line x1="360" y1="237" x2="402" y2="187"/>
      </g>

      <!-- channel cubes, glowing hotter toward the output -->
      <g filter="url(#glow)">
        <rect x="138" y="220" width="14" height="14" rx="3" fill="#8a5bb8" opacity="0.85"/>
        <rect x="224" y="200" width="14" height="14" rx="3" fill="#e0607a"/>
        <rect x="267" y="150" width="14" height="14" rx="3" fill="#f4765c"/>
        <rect x="267" y="260" width="14" height="14" rx="3" fill="#ef6a4e"/>
        <rect x="310" y="190" width="14" height="14" rx="3" fill="#ff9433"/>
        <rect x="353" y="140" width="14" height="14" rx="3" fill="#ffb347"/>
        <rect x="353" y="230" width="14" height="14" rx="3" fill="#ffaa3d"/>
        <rect x="394" y="179" width="16" height="16" rx="3" fill="#ffe08a"/>
      </g>
    </g>
    <!-- brain outline -->
    <use href="#brain" fill="none" stroke="#eef2f8" stroke-width="9" stroke-linejoin="round" opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <text x="222" y="399" text-anchor="end"
        font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif"
        font-size="67" font-weight="800" fill="#FF7A18">AI</text>
  <text x="222" y="399" text-anchor="start"
        font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif"
        font-size="67" font-weight="800" fill="#eef2f8">Fmri</text>
  <text x="256" y="446" text-anchor="middle"
        font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif"
        font-size="17" letter-spacing="0.6" fill="#8b95a9">functional imaging for neural networks</text>
</svg>
